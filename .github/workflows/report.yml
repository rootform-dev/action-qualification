name: integrated PR report
on:
  pull_request:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    concurrency:
      group: rootform-report-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rootform-dev/rootform
          ref: 74bd643f3001a37f8b4f881c0ae33db047b6aba3
          path: fixtures/rootform
          sparse-checkout: examples/playground/shared-data-platform
          persist-credentials: false
      - name: Integrated analysis and genuine negative gate
        id: rootform
        continue-on-error: true
        uses: rootform-dev/action@aa619a35a674a0be901650379db3b0551ee645ad
        with:
          version: 0.1.0-pr.117.1
          input: fixtures/rootform/examples/playground/shared-data-platform/base/plan.json
          plan-file: fixtures/rootform/examples/playground/shared-data-platform/base/plan.tfplan
          policy-pack: fixtures/negative
          comment: 'true'
          artifact-name: integrated-evidence
      - name: Verify integrated union and failed gate evidence
        env:
          ROOTFORM_OUTPUTS: ${{ toJSON(steps.rootform.outputs) }}
          ROOTFORM_EXPECT_ARTIFACT: 'true'
          STEP_OUTCOME: ${{ steps.rootform.outcome }}
        run: |
          node -e "require('node:assert/strict').equal(process.env.STEP_OUTCOME,'failure')"
          node scripts/assert-output.mjs analyze
          node scripts/assert-output.mjs check 1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.rootform.outputs.artifact-id }}
          path: downloaded-integrated
          merge-multiple: true
      - name: Verify exact integrated artifact inventory
        run: node scripts/verify-artifact.mjs downloaded-integrated form.json,report.md,explorer.html,result.json,results.sarif
